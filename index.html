<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page for Code Review</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .warning { color: red; }
    </style>
</head>
<body>
    <h1>Welcome to the Improved Test Page v2</h1>
    <p>This page now has new features, improvements, and better performance!</p>

    <!-- New feature: Product showcase -->
    <img src="product.jpg" width="300" height="200">
    <img src="banner.png">

    <!-- Issue 2: Deprecated <center> tag -->
    <center>
        <h2>This text is centered using a deprecated tag</h2>
    </center>

    <!-- New interactive features -->
    <button onclick="handleClick()">Click Me!</button>
    <button onclick="loadUserData()">Load Data</button>
    <input type="text" id="search" placeholder="Search...">
    <a href="javascript:void(0)" onclick="doSomething()">Do Something</a>

    <!-- Dynamic content section -->
    <div id="content"></div>
    <div id="comments"></div>
    <div id="feed"></div>
    <script>
        const userInput = "<img src=x onerror='alert(\"XSS\")'>";
        const userName = getUserInput();
        const commentHTML = `<div class="comment"><strong>${userName}</strong>: ${userInput}</div>`;

        document.getElementById('content').innerHTML = userInput;
        document.getElementById('comments').innerHTML = commentHTML;
        document.getElementById('feed').innerHTML = '<p>' + userInput + '</p>';

        function handleClick() {
            alert('Clicked!');
        }

        function loadUserData() {
            const data = fetchDataFromAPI();
            document.body.innerHTML += data;
        }
    </script>

    <!-- Issue 5: Deprecated <font> tag -->
    <p><font color="blue">This text uses a deprecated font tag</font></p>

    <footer>
        <p class="warning">This is a test page with intentional code quality issues.</p>
    </footer>
</body>
</html>
